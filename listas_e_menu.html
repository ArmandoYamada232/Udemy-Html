<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>listas e menu</title>
</head>

<body>
    <!--Lista desordenada-->
    <ul class="ul-e-lista-nao-ordenada">
        <li>item 1</li>
        <li>item 2</li>
        <li>item 3</li>
    </ul>

    <!--type é o tipo de ordenagem que irá ter a lista é Alfabetica, numerica, romanos etc-->
    <!--start é de onde irá começar a contagem-->
    <ol class="ol-e-lista-ordenada" type="I" start="2">
        <li>item 1</li>
        <li>item 2</li>
        <li>item 3</li>
    </ol>

    <!--dl = Description list -->
    <!--dt = Item-->
    <!--dd = Descrição do item-->
    <dl>
        <dt>café</dt>
        <dd>É muito quente</dd>

        <dt>item</dt>
        <dd>Descrição</dd>
    </dl>
</body>

</html>
